# Phosphor Icons.
#
# The reason this set exists: it is the one bundled family that ships real
# WEIGHTS. MDI and Fluent are single-weight fonts, so a weight control over them
# has nothing to act on - and icon artwork usually wants a heavier stroke than a
# UI icon font's default.
#
# Five separate static fonts, not a variable one, so the weight is a FACE here
# rather than a wght axis. Listed light to heavy so a picker built from the face
# list reads as a ramp; "regular" is the default. "fill" is a style rather than a
# weight, and comes last for that reason.
#
# All five fonts share ONE codepoints table. Upstream assigns identical
# codepoints across the weights, and download.py verifies that rather than
# assuming it - it fails if they ever diverge, which is when the faces would
# need tables of their own again.
#
# Note that a set mixing weight names with a style name is not weight-indexed by
# glyphsvg, so a NUMERIC --weight=700 will not select "bold" (it warns and is
# ignored, because a static font has no wght axis). A NAMED --weight=bold does
# select the bold face, and is equivalent to --face=bold.
#
# Phosphor also publishes a "duotone" family. It is deliberately not here: the
# two tones are two separate glyphs at consecutive codepoints, and the codepoint
# upstream publishes is the 20%-opacity tint layer, not the icon. Rendering it
# gives an unrecognizable blob; rendering the next codepoint gives something
# byte-identical to the regular face. Carrying it would mean either shipping
# wrong artwork or shipping a duplicate.
#
# Populated by ./download.py - the .ttf and generated files are not committed.

title      = Phosphor Icons
license    = MIT License
kind       = icon
default    = regular
codepoints = phosphor.codepoints
metadata   = phosphor_metadata.json
face = thin     Phosphor-Thin.ttf
face = light    Phosphor-Light.ttf
face = regular  Phosphor.ttf
face = bold     Phosphor-Bold.ttf
face = fill     Phosphor-Fill.ttf
