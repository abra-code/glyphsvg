# Microsoft Fluent System Icons, "Resizable" family.
#
# Two faces over ONE font file. Fluent draws filled and outlined as separate
# glyphs at separate codepoints rather than as a FILL axis, so the fill choice
# is a face here, not an axis - which is why both lines name the same .ttf and
# differ only in their codepoints table.
#
# Resizable is the size-independent family, the right one for icon artwork. The
# per-size families (Regular/Filled) carry the same icon 7 times at 12..48px
# optical sizes, which is noise in a picker; Resizable carries each once.
#
# Populated by ./download.py - the .ttf and generated files are not committed.

title   = Microsoft Fluent System Icons
license = MIT License
kind    = icon
default = regular
face = regular  FluentSystemIcons-Resizable.ttf  fluent-regular.codepoints
face = filled   FluentSystemIcons-Resizable.ttf  fluent-filled.codepoints
