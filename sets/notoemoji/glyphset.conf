# Noto Emoji - the MONOCHROME emoji font, variable weight 300..700.
#
# Deliberately not Noto Color Emoji: that one stores its artwork as embedded PNG
# bitmaps (CBDT/CBLC) and has no outlines at all, so glyphsvg's path extraction
# gets nothing from it. The same is true of Apple Color Emoji (sbix) and of the
# COLR/CPAL and OpenType-SVG builds of Twemoji and OpenMoji. This font is pure
# glyf outlines with no colour tables, which is why it works here.
title      = Noto Emoji
license    = SIL Open Font License 1.1
# An icon font for picker purposes, though its name table is generated from the
# font's own cmap the way the text fonts' are. "kind" answers what the symbols
# ARE, and these are pictographs - a rocket belongs beside a hammer, not beside
# the letter Q. How the table was produced is a provisioning detail and does not
# belong in a user-facing grouping.
kind       = icon
font       = NotoEmoji.ttf
codepoints = notoemoji.codepoints
metadata   = notoemoji_metadata.json
